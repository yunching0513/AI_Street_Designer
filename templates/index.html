<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AI Street Designer | Transform Your City</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Huninn&family=Varela+Round&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-blob blob-mint"></div>
    <div class="bg-blob blob-peach"></div>
    <div class="bg-blob blob-lavender"></div>
    <span class="bg-sparkle sparkle-1">✨</span>
    <span class="bg-sparkle sparkle-2">🌸</span>
    <span class="bg-sparkle sparkle-3">☁️</span>
    <span class="bg-sparkle sparkle-4">🌿</span>

    <main class="container">
        <header class="header">
            <div class="logo">
                <span class="logo-emoji">🌱</span>
                <h1>Street<span class="highlight">Designer</span></h1>
                <span class="logo-emoji">✨</span>
            </div>
            <p class="subtitle">和小綠一起，把你家門口的街道變得更可愛 💕</p>
        </header>

        <div class="app-interface">
            <div class="upload-section" id="drop-zone">
                <input type="file" id="file-input" accept="image/*" hidden>
                <div class="upload-content" id="upload-content">
                    <div class="upload-icon">📸</div>
                    <h3>把街景照片丟過來</h3>
                    <p>拖曳上傳，或點一下選圖 ✨</p>
                </div>
                <div class="preview-container hidden" id="preview-container">
                    <img id="image-preview" src="" alt="Preview">
                    <button class="remove-btn" id="remove-image">
                        <i class="fa-solid fa-times"></i>
                    </button>
                </div>
            </div>

            <div class="controls-section">
                <!-- Preset Prompts -->
                <div class="control-group">
                    <label>選一個改造風格</label>
                    <div class="grid-options">
                        <button class="option-card" data-prompt="Widen sidewalks for better walkability">
                            <span class="option-emoji">🚶</span>
                            <span>加寬人行道</span>
                        </button>
                        <button class="option-card" data-prompt="Add bus bays and transit priority lanes">
                            <span class="option-emoji">🚌</span>
                            <span>公車彎月台</span>
                        </button>
                        <button class="option-card" data-prompt="Add bike lanes and cycling infrastructure">
                            <span class="option-emoji">🚲</span>
                            <span>自行車道</span>
                        </button>
                        <button class="option-card" data-prompt="Increase greenery, add trees and planters">
                            <span class="option-emoji">🌳</span>
                            <span>綠意盎然</span>
                        </button>
                    </div>
                </div>

                <!-- Custom Prompt -->
                <div class="control-group">
                    <label>或是自己許個願 💭</label>
                    <div class="input-wrapper">
                        <input type="text" id="custom-prompt" placeholder="例如：步行區、有咖啡店和露天座位...">
                        <button id="generate-btn" disabled>
                            開始變變變 <span>✨</span>
                        </button>
                    </div>
                </div>

                <!-- Output resolution -->
                <div class="control-group">
                    <label>畫質 🖼️</label>
                    <div class="input-wrapper" style="gap:8px">
                        <select id="resolution-select" style="flex:0 0 auto;padding:10px 14px;border-radius:14px;border:1px solid #D8D1BF;background:#fff;font-size:14px;cursor:pointer;font-family:inherit">
                            <option value="1K">標準 1K（最快）</option>
                            <option value="2K" selected>高畫質 2K（建議）</option>
                            <option value="4K">超高 4K（較慢、成本較高）</option>
                        </select>
                        <span style="font-size:12px;color:#6A665A">之後跟小綠共創的調整版本也會用這個畫質</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Result Section: image + co-pilot chat -->
        <div class="result-section hidden" id="result-section">
            <div class="result-header">
                <div class="result-title">
                    <h2>✨ 你的新街道</h2>
                    <span class="round-badge" id="round-badge">共創回合 1</span>
                </div>
                <button class="close-result" id="close-result" aria-label="關閉">✕</button>
            </div>

            <div class="result-body">
                <!-- Left: image + version strip -->
                <div class="result-image-column">
                    <div class="result-image-wrapper">
                        <div class="loading-overlay hidden" id="loading-overlay">
                            <div class="cute-spinner">
                                <span>🌱</span>
                            </div>
                            <p id="loading-text">小綠正在動筆中...</p>
                        </div>
                        <img id="result-image" src="" alt="Generated Design">
                    </div>
                    <div class="version-strip" id="version-strip"></div>
                </div>

                <!-- Right: co-pilot chat -->
                <aside class="copilot-panel" id="copilot-panel">
                    <div class="copilot-header">
                        <div class="copilot-avatar">🌱</div>
                        <div class="copilot-meta">
                            <strong>小綠</strong>
                            <span>你的街道設計小夥伴</span>
                        </div>
                    </div>
                    <div class="copilot-messages" id="copilot-messages"></div>
                    <div class="copilot-suggestions" id="copilot-suggestions"></div>
                    <form class="copilot-input" id="copilot-input-form">
                        <input type="text" id="copilot-input" placeholder="跟小綠聊聊：再多一些樹、人行道更寬..." autocomplete="off">
                        <button type="submit" id="copilot-send" aria-label="送出">💌</button>
                    </form>
                </aside>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
