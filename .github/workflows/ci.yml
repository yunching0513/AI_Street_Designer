name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Check Python syntax and fatal lint errors
        run: ruff check --select E9,F63,F7,F82 .

      - name: Run static security scan
        run: bandit -q -ll -r app.py

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Check browser JavaScript syntax
        run: node --check static/script.js
